runtime:
  sample_hz: 1
  duration_sec: 600
  seed: 21
  enable_plot: false
  mode: "sim"

simulator:
  tilt_deg_initial: 1.20        # sudah di atas T1=0.8, tapi masih di bawah T2=1.5
  drift_deg_per_hour: 2.0       # cepat, agar tembus T2 dalam ~9 menit dari 1.2
  noise_std_g: 0.0004
  dropout_prob: 0.0

  anomaly:
    enabled: false

processing:
  ema_alpha: 0.35               # respon cepat agar tilt_filt tidak tertinggal
  outlier_clip_g: 0.2

trend:
  window_sec: 240
  min_points: 60
  r2_min: 0.6
  sigma_max: 0.03
  consistency_n: 3
  consistency_m: 5

decision:
  T1_warning_deg: 0.8
  T2_danger_deg: 1.5
  max_delta_deg: 0.5
  max_slope_deg_per_hour: 0.2

output:
  save_csv: true
  csv_path: "outputs/runs/danger_progressive.csv"
  print_every_n: 2

ai:
  enabled: true
  report_path: "outputs/runs/danger_progressive.txt"
