# ==========================================
# EXPERIMENT SIMULATION CONFIG (RESEARCH)
# ==========================================

runtime:
  sample_hz: 1
  duration_sec: 900        # 15 menit eksperimen
  seed: 13
  enable_plot: false
  mode: "sim"              # sim | realtime

# ------------------------------------------
# SENSOR SIMULATOR
# ------------------------------------------
simulator:
  enabled: true

  tilt_deg_initial: 0.6
  drift_deg_per_hour: 0.15
  noise_std_g: 0.0015
  dropout_prob: 0.0

  anomaly:
    enabled: true
    prob_per_min: 0.25
    step_deg: 0.6
    recover: true
    recover_tau_sec: 90

# ------------------------------------------
# PROCESSING
# ------------------------------------------
processing:
  ema_alpha: 0.30
  outlier_clip_g: 0.25

# ------------------------------------------
# TREND ANALYSIS
# ------------------------------------------
trend:
  window_sec: 600
  min_points: 60
  r2_min: 0.60
  sigma_max: 0.06
  consistency_n: 3
  consistency_m: 5

# ------------------------------------------
# DECISION ENGINE
# ------------------------------------------
decision:
  T1_warning_deg: 0.8
  T2_danger_deg: 1.5
  max_delta_deg: 0.5
  max_slope_deg_per_hour: 0.2

# ------------------------------------------
# OUTPUT
# ------------------------------------------
output:
  save_csv: true
  csv_path: "outputs/runs/experiment_sim.csv"
  print_every_n: 2

# ------------------------------------------
# AI (POST-RUN ONLY)
# ------------------------------------------
ai:
  enabled: true
  report_path: "outputs/runs/experiment_sim.txt"