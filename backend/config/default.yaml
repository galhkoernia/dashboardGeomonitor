# ==========================================
# DEFAULT REALTIME CONFIG (SAFE FOR HARDWARE)
# ==========================================

runtime:
  sample_hz: 1
  duration_sec: 0          # 0 = run indefinitely
  seed: null               # tidak dipakai di realtime
  enable_plot: false
  mode: "realtime"         # sim | realtime

# ------------------------------------------
# SENSOR INPUT (REAL HARDWARE)
# ------------------------------------------
sensor:
  type: "imu"              # future-proof (imu, inclinometer, etc)
  source: "hardware"       # hardware | file | mock

  imu:
    model: "MPU6050"
    axes: ["ax", "ay", "az"]
    unit: "g"
    calibration:
      enabled: true
      gravity_ref_g: 1.0

# ------------------------------------------
# SENSOR SIMULATOR (Jika nanti dipasang sensor dihapus)
# ------------------------------------------
simulator:
  tilt_deg_initial: 0.0
  drift_deg_per_hour: 0.0
  noise_std_g: 0.001

# ------------------------------------------
# PROCESSING
# ------------------------------------------
processing:
  ema_alpha: 0.15          # konservatif (reduksi noise)
  outlier_clip_g: 0.15

# ------------------------------------------
# TREND ANALYSIS (ROOT LEVEL — KONSISTEN)
# ------------------------------------------
trend:
  window_sec: 900          # 15 menit
  min_points: 120
  r2_min: 0.70
  sigma_max: 0.05
  consistency_n: 3
  consistency_m: 5

# ------------------------------------------
# DECISION ENGINE (SAFETY)
# ------------------------------------------
decision:
  tilt_warning_deg: 10.0
  tilt_danger_deg: 20.0
  slope_warning_deg_per_hour: 1.0
  slope_danger_deg_per_hour: 2.0

# ------------------------------------------
# OUTPUT
# ------------------------------------------
output:
  save_csv: true
  csv_path: "outputs/runs/realtime_latest.csv"
  print_every_n: 1

# ------------------------------------------
# AI (OFFLINE ONLY)
# ------------------------------------------
ai:
  enabled: false