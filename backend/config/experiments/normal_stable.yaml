runtime:
  sample_hz: 1
  duration_sec: 600
  seed: 10
  enable_plot: false
  mode: "sim"

simulator:
  tilt_deg_initial: 0.3
  drift_deg_per_hour: 0.03     # jauh di bawah max_slope
  noise_std_g: 0.002
  dropout_prob: 0.0

  anomaly:
    enabled: false

processing:
  ema_alpha: 0.2
  outlier_clip_g: 0.2

trend:
  window_sec: 600
  min_points: 60
  r2_min: 0.7
  sigma_max: 0.05
  consistency_n: 3
  consistency_m: 5

decision:
  T1_warning_deg: 0.8
  T2_danger_deg: 1.5
  max_delta_deg: 0.5
  max_slope_deg_per_hour: 0.2

output:
  save_csv: true
  csv_path: "outputs/runs/normal_stable.csv"
  print_every_n: 10

ai:
  enabled: true
  report_path: "outputs/runs/normal_stable.txt"